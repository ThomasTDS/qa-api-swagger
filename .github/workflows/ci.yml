name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

      - name: Run Postman collection via Newman (somente leitura)
        run: npm run postman:run:read-only

      - name: Upload relatórios de teste (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
